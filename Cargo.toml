[package]
name = "rustc-dist"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
arcstr = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
compact_str = "0.9"
env_logger = "0.11"
hdrhistogram = "7.6.0"
immutable-chunkmap = "2.1.5"
libc = "0.2"
log = "0.4"
netidx-core = { path = "../netidx/netidx-core", default-features = false }
netidx-derive = { path = "../netidx/netidx-derive" }
nohash = "0.2.0"
poolshark = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
