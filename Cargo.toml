[package]
name = "rustc-dist"
version = "0.2.1"
edition = "2024"
description = "Schedules rustc on the right cores of each box, and shares builds across boxes over netidx"
license = "MIT"
repository = "https://github.com/estokes/rustc-dist"
readme = "README.md"
keywords = ["cargo", "rustc", "build", "distributed", "netidx"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
debug = false

[dependencies]
anyhow = "1"
arcstr = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
compact_str = "0.9"
env_logger = "0.11"
futures = "0.3.34"
hdrhistogram = "7.6.0"
immutable-chunkmap = "2.1.5"
libc = "0.2"
log = "0.4"
netidx = { version = "0.32.0", path = "../netidx/netidx", default-features = false }
netidx-core = { version = "0.32.0", path = "../netidx/netidx-core", default-features = false }
netidx-derive = { version = "0.32.0", path = "../netidx/netidx-derive" }
netidx-protocols = { version = "0.32.0", path = "../netidx/netidx-protocols", default-features = false }
nohash = "0.2.0"
parking_lot = "0.13.0"
poolshark = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
triomphe = "0.1.17"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zstd = "0.14.3"
